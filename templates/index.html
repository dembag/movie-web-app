{% extends "base.html" %}
{% block content %}

<h1>Users</h1>
<ul class="user-list">
    {% for user in users %}
    <li class="user-entry">
        <a href="{{ url_for('get_movies', user_id=user.id) }}" class="btn">{{ user.name }}</a>
    </li>
    {% endfor %}
</ul>

<form action="{{ url_for('create_users') }}" method="post">
    <label for="new_user_name">Name (3 to 15 characters):</label>
    <input
            type="text"
            id="new_user_name"
            name="new_user_name"
            minlength="3"
            maxlength="15"
            size="15" />
    <input type="submit" value="Add user"/>
</form>



{% endblock %}
